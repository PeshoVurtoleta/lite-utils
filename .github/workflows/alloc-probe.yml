# alloc-probe.yml -- DISPATCH-ONLY research workflow (alloc-per-op TASK 0 / T0e; ruling Q-B82-LINUX (a);
# .handoff/SPEC-alloc-per-op.md section 4.G0 TASK 7). NOT part of CI: no push / pull_request / schedule trigger, no
# gate, no self-test step. It measures (tier REPORTED, hosted CI) and freezes nothing by itself: the alloc-per-op band
# constants (lo = 32 / sub, hiFixed = 524288 / N, hiRel 0.001 x peak, LiteBisect's lb retries <= 6, fences F1 / F2 /
# Fnull) freeze only after the maintainer reads this run's artifacts with research/alloc-probe/ci-report.mjs. The
# workflow is removed (or kept dispatch-only) after that run.
# Each of 8 legs (ubuntu-latest + macos-latest x node 22 / 24 / 26 / 26.8.2) runs research/alloc-probe/ci-probe.mjs,
# which spawns research/alloc-probe/band.mjs (= .handoff r6-band.mjs verbatim, sha256 16929706...) with the node that
# runs it (process.execPath, resolved once), P 2, cwd = a private mktemp dir under $RUNNER_TEMP:
#   T0b band4 cells {1e6, 1e7} x {1e3, 1e4}, K 4, warm 2e5, --expose-gc, 3 rounds
#   T0d fence states fresh / state-1e8 / state-large, --expose-gc, 3 rounds
#   T0c's lb cell (S-A17): N 1e6, SUB 1e4, K 6, WARM 5e6, --expose-gc --no-concurrent-recompilation, 20 rounds at
#       FORCE_RETRY 0 + 1 FORCE_RETRY 7 control
# and uploads ONE JSON per leg as artifact alloc-probe-<os>-node-<node> (retention 30 days).
# Dispatch (the file must be on the default branch first):
#   gh workflow run alloc-probe.yml --ref main
#   gh run list --workflow alloc-probe.yml --limit 1          # note the run id
#   gh run watch <run-id>
# Download + report (every artifact lands in <dir>/<artifact-name>/):
#   gh run download <run-id> --dir <dir> --pattern 'alloc-probe-*'
#   node research/alloc-probe/ci-report.mjs <dir>             # exit 0 PASS / 1 FAIL / 2 NO VERDICT (NO VERDICT wins)
# Pins: every action by full commit SHA, resolved read-only on 2026-11-15 with
# `gh api repos/<action>/git/ref/tags/<tag>` (lightweight tags; the major tag and the release tag name the same
# commit). ci.yml uses the same majors by tag (actions/checkout@v7, actions/setup-node@v7); upload-artifact is not in
# ci.yml.

name: alloc-probe

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  probe:
    name: probe (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # nominal: the local T0b / T0d / T0c grid is minutes per node at P 2; 120 leaves room for a slow hosted runner,
    # and ci-probe.mjs kills its own child after 900 s
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24', '26']
        include:
          - os: ubuntu-latest
            node: '26.8.2'
          - os: macos-latest
            node: '26.8.2'
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (= tag v7)
        with:
          persist-credentials: false
      - name: setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 (= tag v7)
        with:
          node-version: ${{ matrix.node }}
      - name: probe
        env:
          LEG_OS: ${{ matrix.os }}
          LEG_NODE: ${{ matrix.node }}
        run: |
          work="$(mktemp -d "$RUNNER_TEMP/alloc-probe-cwd.XXXXXX")"
          out="$RUNNER_TEMP/alloc-probe-out"
          mkdir -p "$out"
          cd "$work"
          node "$GITHUB_WORKSPACE/research/alloc-probe/ci-probe.mjs" --os "$LEG_OS" --node "$LEG_NODE" --out "$out/alloc-probe-$LEG_OS-node-$LEG_NODE.json"
      - name: upload
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (= tag v7)
        with:
          name: alloc-probe-${{ matrix.os }}-node-${{ matrix.node }}
          path: ${{ runner.temp }}/alloc-probe-out/
          if-no-files-found: error
          retention-days: 30
