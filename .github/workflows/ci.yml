# ci.yml -- lite-utils per-push / per-PR gate (.handoff/PLAN-ci.md, burst 35; rulings Q-CI-1 / Q-CI-3).
# DETERMINISTIC gates only (ROADMAP "Statistical host: none, REPORTED only"): npm test, every root tool's
# --self-test, and the --fixtures self-tests of bytecode-budget and deopt-diff. No quiet lock, no timed gate.
# Matrix: node 22 / 24 / 26 x ubuntu-latest (bash 5, case-sensitive FS; uutils coreutils and a NUL-clean awk as
# of 2026-11) and macos-latest (/bin/bash 3.2, case-insensitive APFS, BSD userland), plus one node 26.8.2 leg per
# OS: 8 legs. No Windows: the tools are bash only. The provenance step prints the awk / tr / mktemp flavour.
# fetch-depth 0: the parity / teeth rows read `git show <commit>:<file>`. The pins live in the test files only:
# GitHub Actions sets CI=true, and under CI=true every history row (the pinned-commit rows of test/bytecode-budget*.test.mjs,
# the deopt-diff-boundary A4 git row, the 221ff2ec base rows of test/deopt-diff-stage*.test.mjs, the spawn-cap S5 teeth
# aecb40f census row) FAILS when its commit is missing (locally it skips with the reason). The history
# step below fails a shallow clone up front.
# The live deopt-diff pair asserts exact lines only on node v26.8.2 (MD-21 (a)), so the two 26.8.2 legs run that
# tier on every push; on every other node it asserts the exit codes and the spawn count only
# (test/deopt-diff-live.test.mjs). Hidden-death detection (death-reporter) is node >= 24 only: its row skips on 22.

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    # 120: npm test alone took 57.7 min on macOS node 22 at 2016586 (run 41987982156); 60 cancelled two legs
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22', '24', '26']
        include:
          - os: ubuntu-latest
            node: '26.8.2'
          - os: macos-latest
            node: '26.8.2'
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # no lockfile and no dependencies: no `npm ci`, no npm cache
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: provenance
        run: |
          bash --version | head -1
          /bin/bash --version | head -1
          node --version
          git --version
          uname -a
          echo "bash on PATH: $(command -v bash)"
          echo "awk on PATH: $(command -v awk)"
          # which userland the oracles meet: awk flavour + NUL handling (BSD awk truncates a record at NUL), coreutils flavour
          { awk --version 2>/dev/null || awk -W version 2>/dev/null || awk -V 2>/dev/null || echo "awk: no version flag"; } | head -1 || true
          printf "a\\0b\\n" | awk "{ print \"awk NUL probe: record length \" length(\$0) \" (3 = NUL-clean, 1 = truncating)\" }" || true
          { tr --version 2>&1 || true; } | head -1 || true
          { mktemp --version 2>&1 || true; } | head -1 || true
      - name: macOS bash on PATH is /bin/bash
        if: runner.os == 'macOS'
        run: test "$(command -v bash)" = /bin/bash
      # the pins live in the test files only: under CI=true a pinned-commit row whose commit is missing FAILS
      - name: full history (not a shallow clone)
        run: test "$(git rev-parse --is-shallow-repository)" = false
      - name: npm test
        run: npm test
      - name: allocation-diff --self-test
        run: bash allocation-diff.sh --self-test
      - name: bytecode-budget --self-test
        run: bash bytecode-budget.sh --self-test
      - name: deopt-diff --self-test
        run: bash deopt-diff.sh --self-test
      - name: ic-diff --self-test
        run: bash ic-diff.sh --self-test
      - name: inlining-budget-diff --self-test
        run: bash inlining-budget-diff.sh --self-test
      - name: bytecode-budget --self-test --fixtures (node 26.8.2 captures)
        run: bash bytecode-budget.sh --self-test --fixtures test/fixtures/bytecode-budget/node-26.8.2
      - name: deopt-diff --self-test --fixtures (node 26.8.2 traces)
        run: bash deopt-diff.sh --self-test --fixtures test/fixtures/deopt-diff/node-26.8.2
